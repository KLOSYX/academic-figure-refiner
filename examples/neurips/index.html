<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="lavish-live-reload" content="root">
  <title>Two-stage retrieval architecture and scaling</title>
  <link rel="stylesheet" href="../../assets/html-figure-template/styles.css">
  <link rel="stylesheet" href="../figure.css">
  <style>
    :root { --figure-width: 139.7mm; }
    .paper-figure { grid-template-columns: 53fr 47fr; }
    .stage { stroke-width: 0.7pt; }
    .stage-label { font-weight: 700; }
    .flow { fill: none; stroke: #56677b; stroke-width: 0.85pt; }
    .query-flow { stroke: #b84b16; stroke-dasharray: 4 3; }
  </style>
  <script src="../plots.js" defer></script>
  <script src="scaling.js" defer></script>
</head>
<body>
  <main class="figure-page">
    <figure class="paper-figure" aria-label="Two-stage retrieval model and simulated size scaling">
      <section class="panel" aria-labelledby="diagram-title">
        <div class="panel-heading">
          <span class="panel-letter">A</span><h2 id="diagram-title">Two-stage retrieval</h2>
        </div>
        <svg viewBox="0 0 266 176" role="img"
          aria-label="Query encoding and document indexing feed retrieval. The query and candidates go to the reranker.">
          <defs>
            <marker id="flow-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7"
              orient="auto">
              <path d="M0 0L8 4L0 8Z" fill="#56677b"/>
            </marker>
            <marker id="query-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7"
              orient="auto">
              <path d="M0 0L8 4L0 8Z" style="fill:#b84b16"/>
            </marker>
          </defs>
          <g class="flow" marker-end="url(#flow-arrow)">
            <path d="M67 27v14"/><path d="M199 27v14"/>
            <path d="M67 65v16h24v10"/><path d="M199 65v16h-24v10"/>
            <path d="M133 117v20"/>
          </g>
          <path class="flow query-flow" d="M28 16H13v135h47" marker-end="url(#query-arrow)"/>
          <rect class="stage" x="28" y="6" width="78" height="21" rx="2" fill="#f3f5f6" stroke="#8695a4"/>
          <rect class="stage" x="160" y="6" width="78" height="21" rx="2" fill="#f3f5f6" stroke="#8695a4"/>
          <rect class="stage" x="16" y="42" width="102" height="23" rx="2" fill="#e8f2f8" stroke="#0072b2"/>
          <rect class="stage" x="148" y="42" width="102" height="23" rx="2" fill="#e8f2f8" stroke="#0072b2"/>
          <rect class="stage" x="60" y="92" width="146" height="25" rx="2" fill="#e8f2f8" stroke="#0072b2"/>
          <rect class="stage" x="60" y="138" width="146" height="26" rx="2" fill="#faede4" stroke="#b84b16"/>
          <text x="67" y="20" text-anchor="middle">Query</text>
          <text x="199" y="20" text-anchor="middle">Corpus</text>
          <text x="67" y="57" text-anchor="middle">Encode query</text>
          <text x="199" y="57" text-anchor="middle">Index documents</text>
          <text class="stage-label" x="133" y="108" text-anchor="middle">Dense retrieval</text>
          <text class="tick-label" x="144" y="131">Top-k candidates</text>
          <text class="stage-label" x="133" y="155" text-anchor="middle">Cross-encoder rerank</text>
          <text class="tick-label" x="22" y="117">Query</text>
        </svg>
      </section>
      <section class="panel" aria-labelledby="scaling-title">
        <div class="panel-heading">
          <span class="panel-letter">B</span><h2 id="scaling-title">Recall as budget grows</h2>
        </div>
        <svg id="scaling" viewBox="0 0 236 176" role="img"
          aria-label="Simulated recall at five on a log-two candidate-budget axis, with mean and standard deviation"></svg>
      </section>
      <figcaption class="figure-note">
        Illustrative architecture and simulated runs. Bands show mean ± one sample SD across five runs.
      </figcaption>
    </figure>
  </main>
</body>
</html>
