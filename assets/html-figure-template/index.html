<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="lavish-live-reload" content="root" />
    <title>Academic Figure</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="figure-page">
      <figure class="paper-figure" aria-label="Publication-ready academic figure">
        <section class="panel panel-a" aria-labelledby="panel-a-title">
          <div class="panel-label">A</div>
          <h2 id="panel-a-title">Task structure</h2>
          <!-- 1:1 SVG user-unit mapping: column width at 178 mm / 2 cols (7 mm gap) is ~323 px at 96 dpi -->
          <svg class="diagram" viewBox="0 0 323 150" role="img" aria-label="Example task timeline">
            <defs>
              <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" />
              </marker>
            </defs>

            <g class="phase" transform="translate(18 24)">
              <rect width="78" height="44" rx="4" />
              <text x="39" y="25.5" text-anchor="middle">Fixation</text>
            </g>
            <line class="connector-line" x1="96" y1="46" x2="115" y2="46" marker-end="url(#arrow)" />

            <g class="phase accent" transform="translate(118 24)">
              <rect width="78" height="44" rx="4" />
              <text x="39" y="25.5" text-anchor="middle">Stimulus</text>
            </g>
            <line class="connector-line" x1="196" y1="46" x2="215" y2="46" marker-end="url(#arrow)" />

            <g class="phase" transform="translate(218 24)">
              <rect width="78" height="44" rx="4" />
              <text x="39" y="25.5" text-anchor="middle">Response</text>
            </g>

            <line class="axis-line" x1="18" y1="90" x2="302" y2="90" marker-end="url(#arrow)" />
            <text class="tick-label" x="57" y="105" text-anchor="middle">500 ms</text>
            <text class="tick-label" x="157" y="105" text-anchor="middle">300 ms</text>
            <text class="tick-label" x="257" y="105" text-anchor="middle">1500 ms</text>
            <text class="small-note" x="161.5" y="132" text-anchor="middle">Replace template content with verified study details</text>
          </svg>
        </section>

        <section class="panel panel-b" aria-labelledby="panel-b-title">
          <div class="panel-label">B</div>
          <h2 id="panel-b-title">Result summary</h2>
          <svg class="chart" viewBox="0 0 323 150" role="img" aria-label="Example vector chart">
            <line class="grid-line" x1="52" y1="69" x2="306" y2="69" />
            <line class="grid-line" x1="52" y1="18" x2="306" y2="18" />

            <line class="axis-line" x1="52" y1="120" x2="306" y2="120" />
            <line class="axis-line" x1="52" y1="18" x2="52" y2="120" />
            <line class="axis-line" x1="48" y1="120" x2="52" y2="120" />
            <line class="axis-line" x1="48" y1="69" x2="52" y2="69" />
            <line class="axis-line" x1="48" y1="18" x2="52" y2="18" />

            <text class="tick-label" x="45" y="123" text-anchor="end">0</text>
            <text class="tick-label" x="45" y="72" text-anchor="end">50</text>
            <text class="tick-label" x="45" y="21" text-anchor="end">100</text>

            <rect class="bar bar-one" x="78" y="54" width="46" height="66" />
            <rect class="bar bar-two" x="156" y="36" width="46" height="84" />
            <rect class="bar bar-three" x="234" y="74" width="46" height="46" />

            <text x="101" y="136" text-anchor="middle">Group 1</text>
            <text x="179" y="136" text-anchor="middle">Group 2</text>
            <text x="257" y="136" text-anchor="middle">Group 3</text>
            <text class="axis-title" x="14" y="69" transform="rotate(-90 14 69)" text-anchor="middle">Verified unit</text>
          </svg>
        </section>
      </figure>
    </main>
  </body>
</html>
